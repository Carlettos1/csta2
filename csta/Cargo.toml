[package]
name = "csta"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Core package for statistical mechanics on rust. Mixes Montecarlo, Metropoli and Wang-Landau generalizations."
keywords = ["monte-carlo", "metropolis", "statistical-physics"]

[dependencies]
csta_core = { path = "../csta_core", version = "^3.0.0" }
csta_derive = { path = "../csta_derive", version = "^3.0.0" }
csta_montecarlo = { path = "../csta_montecarlo", version = "^3.0.0" }
csta_metropolis = { path = "../csta_metropolis", version = "^3.0.0" }
csta_wl = { path = "../csta_wl", version = "^3.0.0" }

[features]
default = []
serde = ["csta_core/serde"]

[dev-dependencies]
rand = "=0.10.2"
